name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node dependencies
        run: |
          npm install

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          # If the android directory doesn't exist yet in the repo, add it first
          if [ ! -d "android" ]; then
            echo "Directorio android no encontrado. Agregando plataforma Android con Capacitor..."
            npx cap add android
          fi
          echo "Sincronizando plataforma Android..."
          npx cap sync android

      - name: 🔑 Grant execute permissions to Gradle wrapper
        run: |
          chmod +x android/gradlew

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gg-keymapper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
